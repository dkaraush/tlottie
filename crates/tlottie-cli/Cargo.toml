[package]
name = "tlottie-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dev CLI for tlottie: inspect, render, and corpus-test (never ships)"

[dependencies]
ash = { version = "0.37.3", default-features = false, features = ["loaded"], optional = true }
libc = "0.2.186"
tlottie = { path = "../tlottie" }
tlottie-vulkan = { path = "../tlottie-vulkan", optional = true }

[features]
vulkan = ["dep:ash", "dep:tlottie-vulkan"]

[lints]
workspace = true
